<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Warm Spice · Black pepper (मरिचम्)">
  <defs>
    <radialGradient id="pepperGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="70%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="millWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="millDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#5c2410"/>
    </linearGradient>
    <radialGradient id="peppercornGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <g id="peppercorn">
      <circle cx="0" cy="0" r="5" fill="url(#peppercornGrad)" stroke="#020617" stroke-width="1"/>
      <circle cx="-1.5" cy="-1.5" r="1.3" fill="#94a3b8" opacity="0.75"/>
    </g>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#pepperGlow)"/>

  <!-- Pepper Grinder Mill Body (Classic hourglass turned silhouette) -->
  <g transform="translate(68, 62)">
    <!-- Base -->
    <path d="M-16,34 L16,34 Q18,34 18,31 L15,16 Q13,10 9,6 L9,-10 Q14,-14 16,-18 L16,-26 Q16,-28 13,-28 L-13,-28 Q-16,-28 -16,-26 L-16,-18 Q-14,-14 -9,-10 L-9,6 Q-13,10 -15,16 L-18,31 Q-18,34 -16,34 Z" fill="url(#millWood)" stroke="#5c2410" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Wood Ring Accents -->
    <ellipse cx="0" cy="34" rx="16" ry="3.5" fill="#78350f" opacity="0.6"/>
    <ellipse cx="0" cy="-18" rx="15" ry="3" fill="#78350f" opacity="0.45"/>
    <path d="M-13,-20 Q0,-16 13,-20" fill="none" stroke="#fef3c7" stroke-width="1.8" opacity="0.7"/>
    <path d="M-15,18 Q0,23 15,18" fill="none" stroke="#fef3c7" stroke-width="1.8" opacity="0.7"/>

    <!-- Brass / Metal Grinder Top Mechanism & Turning Finial -->
    <rect x="-3" y="-35" width="6" height="7" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
    <circle cx="0" cy="-38" r="6" fill="#f59e0b" stroke="#78350f" stroke-width="1.6"/>
    <circle cx="-1.5" cy="-39.5" r="1.6" fill="#fef3c7" opacity="0.8"/>
  </g>

  <!-- Pile of Whole Black Peppercorns on the side/front -->
  <use href="#peppercorn" transform="translate(24, 88) scale(1.1)"/>
  <use href="#peppercorn" transform="translate(34, 86) scale(1.05)"/>
  <use href="#peppercorn" transform="translate(44, 88) scale(1.2)"/>
  <use href="#peppercorn" transform="translate(28, 80) scale(1)"/>
  <use href="#peppercorn" transform="translate(38, 78) scale(1.1)"/>
  <use href="#peppercorn" transform="translate(48, 81) scale(0.95)"/>
  <use href="#peppercorn" transform="translate(34, 72) scale(0.9)"/>
  <use href="#peppercorn" transform="translate(18, 92) scale(0.9)"/>
  <use href="#peppercorn" transform="translate(28, 94) scale(1.1)"/>
  <use href="#peppercorn" transform="translate(40, 94) scale(1.05)"/>
  <use href="#peppercorn" transform="translate(52, 91) scale(1.15)"/>

  <!-- Warm spice aroma sparkles -->
  <circle cx="26" cy="42" r="3" fill="#0284c7" opacity="0.8"/>
  <circle cx="36" cy="32" r="2" fill="#38bdf8"/>
  <circle cx="18" cy="54" r="2" fill="#0284c7"/>
</svg>
