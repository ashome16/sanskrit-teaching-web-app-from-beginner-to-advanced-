<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Asafoetida spice pot and resin pinch (Hing)">
  <defs>
    <radialGradient id="hingBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dibbiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="resinLump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="28" fill="url(#hingBg)"/>

  <!-- Warm aroma swirls rising from hing -->
  <path d="M22,15 Q19,10 23,6" fill="none" stroke="#d97706" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M31,13 Q28,8 32,4" fill="none" stroke="#f59e0b" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M48,25 Q46,20 50,16" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Traditional Indian Hing Dibbi (brass-rimmed saffron spice pot) -->
  <rect x="11" y="22" width="28" height="27" rx="8" fill="url(#dibbiBody)" stroke="#78350f" stroke-width="1.7"/>
  <!-- Ivory kitchen label band -->
  <rect x="13" y="30" width="24" height="11" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <circle cx="25" cy="35.5" r="3.2" fill="#f59e0b"/>
  <!-- Open golden powder rim at top of dibbi -->
  <ellipse cx="25" cy="22" rx="12.5" ry="4.5" fill="#78350f" stroke="#451a03" stroke-width="1.3"/>
  <path d="M15,22 Q25,15 35,22 Z" fill="#fef08a"/>

  <!-- Foreground golden-amber Hing resin lumps + tadka pinch spoon -->
  <path d="M34,53 L57,43" stroke="#92400e" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="36" cy="52" rx="11" ry="5.5" fill="#b45309" stroke="#5c2d16" stroke-width="1.4"/>
  <!-- Fine golden hing powder pinch on spoon -->
  <path d="M27,52 Q36,41 45,52 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.1"/>
  <!-- Natural amber hing resin chunk -->
  <polygon points="46,56 53,51 58,55 54,60 47,59" fill="url(#resinLump)" stroke="#78350f" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
