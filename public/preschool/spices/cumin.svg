<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sizzle Seed · Cumin (जीरकम्)">
  <defs>
    <radialGradient id="jarGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lidWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fef3c7" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#e2e8f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="jeeraFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <g id="jeeraSeedSmall">
      <path d="M-6,0 Q0,-2.5 6,0 Q0,2.5 -6,0 Z" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
      <path d="M-4,0 Q0,-1.2 4,0" fill="none" stroke="#fde68a" stroke-width="0.7" stroke-linecap="round"/>
    </g>
  </defs>

  <circle cx="60" cy="62" r="50" fill="url(#jarGlow)"/>

  <!-- Glass Spice Jar Body -->
  <rect x="30" y="38" width="60" height="66" rx="14" fill="url(#jarGlass)" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Golden Cumin Fill inside Jar -->
  <path d="M33,52 Q45,49 60,51 Q75,49 87,52 L87,90 Q87,100 76,101 L44,101 Q33,100 33,90 Z" fill="url(#jeeraFill)"/>

  <!-- Seeds inside Jar -->
  <use href="#jeeraSeedSmall" transform="translate(45 60) rotate(-18) scale(1.1)"/>
  <use href="#jeeraSeedSmall" transform="translate(62 58) rotate(14) scale(1.1)"/>
  <use href="#jeeraSeedSmall" transform="translate(74 64) rotate(-22) scale(1.05)"/>
  <use href="#jeeraSeedSmall" transform="translate(40 72) rotate(12) scale(1.1)"/>
  <use href="#jeeraSeedSmall" transform="translate(56 70) rotate(-8) scale(1.15)"/>
  <use href="#jeeraSeedSmall" transform="translate(72 74) rotate(26) scale(1.1)"/>
  <use href="#jeeraSeedSmall" transform="translate(48 83) rotate(-15) scale(1.1)"/>
  <use href="#jeeraSeedSmall" transform="translate(64 82) rotate(8) scale(1.15)"/>
  <use href="#jeeraSeedSmall" transform="translate(54 93) rotate(-5) scale(1.1)"/>
  <use href="#jeeraSeedSmall" transform="translate(70 91) rotate(19) scale(1.05)"/>

  <!-- Glass reflection highlight -->
  <path d="M35,46 L35,88 Q35,94 40,96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- Jar Neck & Lid -->
  <rect x="38" y="30" width="44" height="10" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="34" y="20" width="52" height="13" rx="5" fill="url(#lidWood)" stroke="#5c2410" stroke-width="2.2"/>
  <!-- Lid knob/groove -->
  <rect x="42" y="16" width="36" height="5" rx="2.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.4"/>

  <!-- Sizzle steam sparkles -->
  <path d="M22,26 Q19,18 24,12" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="25" cy="8" r="2.2" fill="#ea580c"/>
  <path d="M96,28 Q100,20 95,14" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="94" cy="9" r="2.2" fill="#ea580c"/>
</svg>
