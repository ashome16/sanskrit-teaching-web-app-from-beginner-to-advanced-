<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" role="img" aria-label="The Spice Adventure Mascot Chef">
  <defs>
    <radialGradient id="coverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="chefHat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="60" cy="50" r="48" fill="url(#coverGlow)"/>

  <!-- Left: Mini Earth Globe -->
  <g transform="translate(18, 52) scale(0.24)">
    <circle cx="50" cy="50" r="46" fill="url(#globeGrad)" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M25,30 Q45,20 60,35 Q75,50 65,70 Q45,80 30,65 Q20,50 25,30 Z" fill="#86efac" stroke="#15803d" stroke-width="3"/>
    <path d="M68,25 Q80,30 85,42 Q75,48 70,38 Z" fill="#86efac"/>
  </g>

  <!-- Right: Cinnamon stick and rolling pin -->
  <g transform="translate(94, 45) rotate(28)">
    <rect x="-4" y="-20" width="8" height="40" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.8"/>
    <ellipse cx="0" cy="-20" rx="4" ry="2" fill="#d97706"/>
    <ellipse cx="0" cy="20" rx="4" ry="2" fill="#78350f"/>
    <!-- cinnamon lines -->
    <line x1="-1" y1="-14" x2="-1" y2="14" stroke="#78350f" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Golden sparkle stars around -->
  <path d="M26,22 L27.5,25.5 L31,27 L27.5,28.5 L26,32 L24.5,28.5 L21,27 L24.5,25.5 Z" fill="#f59e0b"/>
  <path d="M96,24 L97,26.5 L99.5,27.5 L97,28.5 L96,31 L95,28.5 L92.5,27.5 L95,26.5 Z" fill="#f59e0b"/>
  <path d="M60,10 L61.5,14 L65.5,15.5 L61.5,17 L60,21 L58.5,17 L54.5,15.5 L58.5,14 Z" fill="#fbbf24"/>

  <!-- Chef Mascot Character -->
  <!-- Chef Arms welcoming -->
  <path d="M42,68 C30,66 22,58 20,52 C18,48 24,46 26,50 C29,56 36,60 44,63 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="20" cy="49" r="4.5" fill="#fed7aa" stroke="#334155" stroke-width="1.8"/>
  <path d="M78,68 C90,66 98,58 100,52 C102,48 96,46 94,50 C91,56 84,60 76,63 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="49" r="4.5" fill="#fed7aa" stroke="#334155" stroke-width="1.8"/>

  <!-- Chef Jacket Body -->
  <path d="M40,64 L80,64 L84,95 L36,95 Z" fill="#f8fafc" stroke="#334155" stroke-width="2.2"/>
  <!-- Red neck scarf -->
  <path d="M48,58 Q60,67 72,58 L68,64 L60,68 L52,64 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.6"/>
  <!-- Double-breasted buttons -->
  <circle cx="53" cy="74" r="2.2" fill="#ef4444"/>
  <circle cx="67" cy="74" r="2.2" fill="#ef4444"/>
  <circle cx="53" cy="84" r="2.2" fill="#ef4444"/>
  <circle cx="67" cy="84" r="2.2" fill="#ef4444"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="48" rx="16" ry="15" fill="#fed7aa" stroke="#334155" stroke-width="2"/>
  <!-- Ears -->
  <circle cx="43" cy="48" r="3.5" fill="#fed7aa" stroke="#334155" stroke-width="1.5"/>
  <circle cx="77" cy="48" r="3.5" fill="#fed7aa" stroke="#334155" stroke-width="1.5"/>

  <!-- Rosy cheeks -->
  <circle cx="50" cy="51" r="3" fill="#f43f5e" opacity="0.35"/>
  <circle cx="70" cy="51" r="3" fill="#f43f5e" opacity="0.35"/>

  <!-- Eyes with happy curved twinkle -->
  <ellipse cx="53" cy="44" rx="2.5" ry="3.2" fill="#1e293b"/>
  <circle cx="52" cy="43" r="1" fill="#ffffff"/>
  <ellipse cx="67" cy="44" rx="2.5" ry="3.2" fill="#1e293b"/>
  <circle cx="66" cy="43" r="1" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M49,38 Q53,35 57,38" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M63,38 Q67,35 71,38" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Friendly Brown Chef Mustache -->
  <path d="M60,51 C57,48 51,48 48,52 C51,55 57,54 60,52 C63,54 69,55 72,52 C69,48 63,48 60,51 Z" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
  <!-- Big smiling mouth below mustache -->
  <path d="M53,53 Q60,60 67,53" fill="#f43f5e" stroke="#334155" stroke-width="1.6"/>
  <path d="M55,54 Q60,58 65,54" fill="#ffffff"/>

  <!-- Big Poofy White Chef Hat (Toque) -->
  <path d="M44,35 C38,32 38,20 46,18 C48,10 62,8 66,16 C74,10 82,18 78,25 C84,28 80,36 76,35 Z" fill="url(#chefHat)" stroke="#334155" stroke-width="2.2"/>
  <!-- Hat band -->
  <path d="M44,32 L76,32 L75,37 L45,37 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <!-- Hat puff creases -->
  <path d="M52,20 Q54,29 55,32" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M64,18 Q64,28 65,32" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>