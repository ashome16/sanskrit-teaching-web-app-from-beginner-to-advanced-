<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pop Seed · Mustard (सर्षपः)">
  <defs>
    <radialGradient id="mustardGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terracottaBowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="raiSeed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </radialGradient>
    <g id="seedMoundDot">
      <circle cx="0" cy="0" r="3.2" fill="url(#raiSeed)" stroke="#1c0a02" stroke-width="0.7"/>
      <circle cx="-0.8" cy="-0.8" r="0.9" fill="#fde68a" opacity="0.65"/>
    </g>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#mustardGlow)"/>

  <!-- Terracotta Clay Bowl Rim & Body -->
  <g transform="translate(60, 68)">
    <!-- Bowl Underbody -->
    <path d="M-40,0 Q-44,32 0,34 Q44,32 40,0 Z" fill="url(#terracottaBowl)" stroke="#451a03" stroke-width="2.4"/>
    <ellipse cx="0" cy="34" rx="16" ry="3" fill="#451a03" opacity="0.4"/>

    <!-- Heap of Dark Mustard Seeds overflowing rim -->
    <ellipse cx="0" cy="-2" rx="42" ry="16" fill="#451a03"/>
    <ellipse cx="0" cy="-6" rx="35" ry="14" fill="#78350f"/>
    <ellipse cx="0" cy="-12" rx="26" ry="11" fill="#92400e"/>

    <!-- Rim Lip -->
    <ellipse cx="0" cy="0" rx="42" ry="8" fill="none" stroke="#7c2d12" stroke-width="2"/>

    <!-- Textured Mustard Seeds in Bowl -->
    <use href="#seedMoundDot" transform="translate(-25, -4)"/>
    <use href="#seedMoundDot" transform="translate(-16, -9)"/>
    <use href="#seedMoundDot" transform="translate(-6, -14)"/>
    <use href="#seedMoundDot" transform="translate(5, -15)"/>
    <use href="#seedMoundDot" transform="translate(18, -10)"/>
    <use href="#seedMoundDot" transform="translate(28, -5)"/>
    <use href="#seedMoundDot" transform="translate(-20, 2)"/>
    <use href="#seedMoundDot" transform="translate(-10, -2)"/>
    <use href="#seedMoundDot" transform="translate(0, -5)"/>
    <use href="#seedMoundDot" transform="translate(12, -1)"/>
    <use href="#seedMoundDot" transform="translate(24, 1)"/>
    <use href="#seedMoundDot" transform="translate(-4, -9)"/>
    <use href="#seedMoundDot" transform="translate(8, -8)"/>
  </g>

  <!-- Energetic Pop! Seeds leaping with yellow/orange star bursts -->
  <!-- Pop 1 (Top Left) -->
  <path d="M22,28 L30,34 M20,38 L30,36 M26,22 L32,32" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="32" r="4.2" fill="url(#raiSeed)" stroke="#1c0a02" stroke-width="1"/>
  <circle cx="27" cy="30.5" r="1.1" fill="#fef08a"/>

  <!-- Pop 2 (Top Center high) -->
  <path d="M54,16 L60,24 M66,16 L60,24 M60,12 L60,22" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="24" r="4.6" fill="url(#raiSeed)" stroke="#1c0a02" stroke-width="1"/>
  <circle cx="58.5" cy="22.5" r="1.2" fill="#fef08a"/>

  <!-- Pop 3 (Top Right) -->
  <path d="M96,28 L88,34 M98,38 L88,36 M94,22 L88,32" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="90" cy="34" r="4.2" fill="url(#raiSeed)" stroke="#1c0a02" stroke-width="1"/>
  <circle cx="89" cy="32.5" r="1.1" fill="#fef08a"/>

  <!-- Golden sparkle bursts -->
  <polygon points="40,24 42,28 46,30 42,32 40,36 38,32 34,30 38,28" fill="#f59e0b"/>
  <polygon points="78,22 80,26 84,28 80,30 78,34 76,30 72,28 76,26" fill="#f59e0b"/>
</svg>
