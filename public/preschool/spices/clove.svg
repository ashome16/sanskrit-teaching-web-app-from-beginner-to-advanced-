<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Whole cloves (Lavang)">
  <defs>
    <radialGradient id="cloveHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="70%" stop-color="#fed7aa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloveStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#5c2410"/>
      <stop offset="100%" stop-color="#3b1508"/>
    </linearGradient>
    <radialGradient id="cloveBud" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <g id="wholeClove">
      <!-- Unopened round golden-russet flower bud -->
      <circle cx="0" cy="-16.5" r="6.2" fill="url(#cloveBud)" stroke="#5c2410" stroke-width="1.2"/>
      <circle cx="-2" cy="-18.5" r="1.7" fill="#fef3c7" opacity="0.7"/>
      <!-- 4 pointed calyx sepals cradling the bud -->
      <path d="M-4.8,-11 L-9.5,-16.5 L-3,-13.2 L0,-18.2 L3,-13.2 L9.5,-16.5 L4.8,-11 Z" fill="#6b2710" stroke="#3b1508" stroke-width="1" stroke-linejoin="round"/>
      <!-- Tapered woody clove stem -->
      <path d="M-4.6,-11.5 C-4.2,-2 -2.8,10 -1.8,18 C-1.2,20.5 1.2,20.5 1.8,18 C2.8,10 4.2,-2 4.6,-11.5 Z" fill="url(#cloveStem)" stroke="#3b1508" stroke-width="1.1"/>
      <path d="M-1.5,-8 C-1.2,0 -0.8,9 -0.5,15" fill="none" stroke="#a16207" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
    </g>
  </defs>

  <circle cx="32" cy="32" r="28" fill="url(#cloveHalo)"/>

  <!-- Fresh aromatic clove leaf behind -->
  <path d="M31,42 C17,41 10,30 14,19 C24,20 31,29 31,42 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.4"/>
  <path d="M16,22 Q24,30 30,40" fill="none" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Two whole dried cloves (Lavang) with unmistakable 4-sepal crown + round flower bud -->
  <use href="#wholeClove" transform="translate(26 33) rotate(-22) scale(1.05)"/>
  <use href="#wholeClove" transform="translate(41 36) rotate(24) scale(0.96)"/>
</svg>
