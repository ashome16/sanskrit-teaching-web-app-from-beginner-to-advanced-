<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Cozy Root · Ginger (आर्द्रकम्)">
  <defs>
    <radialGradient id="gingerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gingerSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gingerCut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#gingerGlow)"/>

  <!-- Knobby Ginger Root Rhizome Body -->
  <g transform="translate(56, 60)">
    <!-- Main knobby hand of ginger -->
    <path d="M-36,-12 C-40,-2 -36,14 -24,20 C-18,23 -12,28 -8,36 C-4,42 4,40 10,34 C16,28 26,26 34,16 C42,6 40,-8 30,-16 C22,-22 14,-22 8,-16 C2,-10 -6,-16 -12,-22 C-18,-28 -28,-26 -32,-18 Z" fill="url(#gingerSkin)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Top Thumb Knob -->
    <path d="M-12,-20 C-10,-32 4,-34 6,-22" fill="url(#gingerSkin)" stroke="#78350f" stroke-width="2.2"/>

    <!-- Right Side Knob -->
    <path d="M22,-14 C32,-22 42,-12 34,-2" fill="url(#gingerSkin)" stroke="#78350f" stroke-width="2.2"/>

    <!-- Bottom Sprout Knob -->
    <path d="M-14,18 C-16,30 -4,32 -2,22" fill="url(#gingerSkin)" stroke="#78350f" stroke-width="2.2"/>

    <!-- Natural Root Ring Rings & Wrinkles -->
    <path d="M-28,-8 Q-22,-4 -26,4" fill="none" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M-20,-16 Q-14,-12 -18,-6" fill="none" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M-4,-24 Q2,-20 -2,-14" fill="none" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M8,4 Q16,8 12,18" fill="none" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M18,-4 Q26,0 22,8" fill="none" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

    <!-- Golden Highlight sheen -->
    <path d="M-28,-14 Q-18,-2 -12,12" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M-4,-8 Q6,4 16,6" fill="none" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Cut Round Golden Ginger Slice in Foreground -->
  <g transform="translate(86, 78) rotate(14)">
    <ellipse cx="0" cy="0" rx="15" ry="13" fill="#ca8a04" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="-1" cy="0" rx="13" ry="11.5" fill="url(#gingerCut)"/>
    <!-- Fibrous juicy center ring -->
    <ellipse cx="-1" cy="0" rx="8.5" ry="7" fill="none" stroke="#eab308" stroke-width="1.4" stroke-dasharray="2.5 2"/>
    <circle cx="-1" cy="0" r="1.5" fill="#ca8a04"/>
  </g>

  <!-- Warm cozy ginger tea steam sparkles -->
  <path d="M24,24 Q20,16 26,10" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <path d="M34,20 Q30,12 36,6" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
</svg>
