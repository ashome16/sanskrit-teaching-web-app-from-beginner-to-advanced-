<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="White Bulb · Garlic (लशुनम्)">
  <defs>
    <radialGradient id="garlicGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="70%" stop-color="#fae8ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fae8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="garlicWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="garlicSkinPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="45%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="garlicStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#garlicGlow)"/>

  <!-- Whole Garlic Bulb (Centered) -->
  <g transform="translate(68, 62)">
    <!-- Root base beard -->
    <ellipse cx="0" cy="27" rx="9" ry="3.5" fill="#ca8a04" opacity="0.65"/>
    <path d="M-6,28 L-7,34 M-2,28 L-2,35 M3,28 L4,34 M7,28 L8,33" stroke="#a16207" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Left outer lobe -->
    <path d="M0,26 C-18,26 -28,16 -28,0 C-28,-14 -12,-24 0,-25 Z" fill="url(#garlicSkinPink)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M-6,-22 C-18,-12 -22,4 -14,20" fill="none" stroke="#d8b4fe" stroke-width="1.6" opacity="0.5" stroke-linecap="round"/>

    <!-- Right outer lobe -->
    <path d="M0,26 C18,26 28,16 28,0 C28,-14 12,-24 0,-25 Z" fill="url(#garlicWhite)" stroke="#94a3b8" stroke-width="2"/>
    <path d="M6,-22 C18,-12 22,4 14,20" fill="none" stroke="#cbd5e1" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>

    <!-- Center prominent front clove lobe -->
    <path d="M-12,26 C-18,14 -14,-4 -3,-24 C0,-26 2,-26 5,-24 C16,-4 20,14 14,26 C6,29 -4,29 -12,26 Z" fill="url(#garlicWhite)" stroke="#64748b" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,-24 Q-2,0 0,26" fill="none" stroke="#f1f5f9" stroke-width="2.5" opacity="0.8"/>
    <path d="M-5,-16 Q-10,4 -6,22" fill="none" stroke="#e9d5ff" stroke-width="1.4" opacity="0.6"/>

    <!-- Dry papery stalk/neck at top -->
    <path d="M-4,-24 L-3,-38 Q0,-41 3,-38 L4,-24 Z" fill="url(#garlicStem)" stroke="#713f12" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- Detached Garlic Clove in Foreground Left -->
  <g transform="translate(30, 80) rotate(-22)">
    <path d="M0,-16 C10,-10 14,0 12,12 C10,18 2,18 -3,14 C-10,8 -10,-8 0,-16 Z" fill="url(#garlicWhite)" stroke="#64748b" stroke-width="2"/>
    <!-- Clove curve ridge -->
    <path d="M0,-14 Q4,2 0,14" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
    <!-- Clove tail & root dot -->
    <path d="M0,-16 L1,-19" stroke="#a16207" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="1" cy="15" r="1.6" fill="#a16207"/>
  </g>

  <!-- Second Small Clove beside it -->
  <g transform="translate(18, 88) rotate(-48)">
    <path d="M0,-12 C8,-8 10,0 8,8 C6,13 0,13 -2,10 C-8,5 -8,-6 0,-12 Z" fill="url(#garlicSkinPink)" stroke="#94a3b8" stroke-width="1.8"/>
  </g>
</svg>
