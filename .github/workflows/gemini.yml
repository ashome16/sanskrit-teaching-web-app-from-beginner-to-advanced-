name: Gemini AI Assistant

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v1
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          command: '/review'
